      <ellipse cx="3" cy="-2.5" rx="4" ry="2.6" fill="#B7B7E2"/>
      <circle cx="-54" cy="22" r="2.2" fill="#CBB2AB"/><circle cx="48" cy="24" r="1.8" fill="#CBB2AB"/><circle cx="-14" cy="-30" r="1.6" fill="#CBB2AB"/>
