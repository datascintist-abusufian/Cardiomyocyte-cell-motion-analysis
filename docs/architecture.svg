      <circle cx="60" cy="25" r="4.5" fill="#A9651F"/>
      <rect x="32" y="35" width="50" height="17" rx="2" fill="#F7F8F9" stroke="#DDE1E5" stroke-width="0.8"/>
      <ellipse cx="45" cy="43" rx="6" ry="3.5" fill="#F3C4B8" stroke="#B05C46" stroke-width="0.8"/><ellipse cx="63" cy="46" rx="5" ry="3" fill="#F3C4B8" stroke="#B05C46" stroke-width="0.8"/>
      <rect x="0" y="0" width="90" height="58" rx="4" fill="none" stroke="#A9651F" stroke-width="1.4"/>
    </g>
    <text x="127" y="200" font-size="12.5" font-weight="600" text-anchor="middle">Stage parameter model</text>
    <text x="363" y="200" font-size="12.5" font-weight="600" text-anchor="middle">Temporal interpolation</text>
    <text x="599" y="200" font-size="12.5" font-weight="600" text-anchor="middle">Procedural frame synthesis</text>
    <text x="835" y="200" font-size="12.5" font-weight="600" text-anchor="middle">Sampling and GIF encoding</text>
    <text x="1071" y="200" font-size="12.5" font-weight="600" text-anchor="middle">Interactive front end</text>
    <text x="37" y="224" font-size="9.8" fill="#45505A"><tspan x="37" dy="0">Eight discrete stage descriptors</tspan><tspan x="37" dy="15">spanning culture Day 1 to Day 8:</tspan><tspan x="37" dy="15">elongation, alignment, cell-cell</tspan><tspan x="37" dy="15">coupling, sarcomere order, beat</tspan><tspan x="37" dy="15">amplitude, synchrony, debris</tspan></text>
    <text x="273" y="224" font-size="9.8" fill="#45505A"><tspan x="273" dy="0">Piecewise linear interpolation</tspan><tspan x="273" dy="15">of every scalar descriptor onto</tspan><tspan x="273" dy="15">a continuous day axis; the base</tspan><tspan x="273" dy="15">colour is interpolated per RGB</tspan><tspan x="273" dy="15">channel. Memoised at call level.</tspan></text>
    <text x="509" y="224" font-size="9.8" fill="#45505A"><tspan x="509" dy="0">Cluster centroids sampled, then</tspan><tspan x="509" dy="15">polar offsets within a cluster</tspan><tspan x="509" dy="15">radius; ellipse morphology from</tspan><tspan x="509" dy="15">elongation and beat gain</tspan><tspan x="509" dy="15">1 + A sin(pi phi); sarcomere</tspan><tspan x="509" dy="15">raster, nucleus, debris field</tspan></text>
    <text x="745" y="224" font-size="9.8" fill="#45505A"><tspan x="745" dy="0">Uniform sampling of 12 to 16</tspan><tspan x="745" dy="15">keyframes across the selected</tspan><tspan x="745" dy="15">day range; Pillow GIF writer,</tspan><tspan x="745" dy="15">infinite loop, 125 / 250 / 500</tspan><tspan x="745" dy="15">ms inter-frame delay</tspan></text>
    <text x="981" y="224" font-size="9.8" fill="#45505A"><tspan x="981" dy="0">Streamlit single-page app with</tspan><tspan x="981" dy="15">speed, day-range and preview</tspan><tspan x="981" dy="15">controls; frames cached at 0.5</tspan><tspan x="981" dy="15">day resolution; preview, full</tspan><tspan x="981" dy="15">sequence and GIF export</tspan></text>
    <path d="M 363 324 L 363 356 M 599 324 L 599 356 M 1071 324 L 1071 356" stroke="#9AA3AB" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
    <rect x="24" y="356" width="1150" height="76" rx="7" fill="#F8F9FB" stroke="#C7CDD3" stroke-width="1" stroke-dasharray="5 3"/>
    <text x="44" y="380" font-size="12" font-weight="600">Execution substrate</text>
    <text x="44" y="402" font-size="10" font-weight="700" fill="#35715A">Memoisation</text><text x="44" y="418" font-size="9.8" fill="#4A555F">st.cache_data on interpolation and frame synthesis</text>
    <text x="424" y="402" font-size="10" font-weight="700" fill="#35715A">Session state</text><text x="424" y="418" font-size="9.8" fill="#4A555F">Keyframe cache keyed to 0.5 day resolution</text>
    <text x="804" y="402" font-size="10" font-weight="700" fill="#35715A">Rasteriser</text><text x="804" y="418" font-size="9.8" fill="#4A555F">NumPy stochastic sampling, Pillow ImageDraw, RGB canvas</text>
    <rect x="24" y="448" width="13" height="13" rx="2.5" fill="#EEF4F8" stroke="#2C5F7C" stroke-width="1.2"/><text x="43" y="458" font-size="10" fill="#3C4A54">Parameter model</text>
    <rect x="164" y="448" width="13" height="13" rx="2.5" fill="#EBF3ED" stroke="#35715A" stroke-width="1.2"/><text x="183" y="458" font-size="10" fill="#3C4A54">Computation</text>
    <rect x="290" y="448" width="13" height="13" rx="2.5" fill="#FBF2E9" stroke="#A9651F" stroke-width="1.2"/><text x="309" y="458" font-size="10" fill="#3C4A54">Encoding and interface</text>
    <line x1="460" y1="455" x2="492" y2="455" stroke="#3C4A54" stroke-width="1.6" marker-end="url(#ah)"/><text x="502" y="458" font-size="10" fill="#3C4A54">Data flow</text>
    <line x1="580" y1="455" x2="612" y2="455" stroke="#9AA3AB" stroke-width="1.2" stroke-dasharray="4 3"/><text x="622" y="458" font-size="10" fill="#3C4A54">Runtime dependency</text>
    <text x="24" y="498" font-size="10.5" fill="#2A3440"><tspan font-weight="700">Figure 1 |</tspan> Processing architecture of the cardiomyocyte morphodynamic simulator. An eight-stage descriptor set (a) is interpolated</text>
    <text x="24" y="514" font-size="10.5" fill="#2A3440">onto a continuous temporal axis (b) and rasterised into synthetic contraction frames (c). Frames are sampled and encoded as an</text>
    <text x="24" y="530" font-size="10.5" fill="#2A3440">animated sequence (d) and exposed together with the parameter controls in the interactive front end (e). No experimental image data is used.</text>
  </g>
</svg>
