      <rect x="14" y="0" width="64" height="42" rx="3" fill="#ffffff" stroke="#C2C8CE" stroke-width="1"/>
      <rect x="7" y="7" width="64" height="42" rx="3" fill="#ffffff" stroke="#9AA2AA" stroke-width="1"/>
      <rect x="0" y="14" width="64" height="42" rx="3" fill="#FDF6EE" stroke="#A9651F" stroke-width="1.4"/>
