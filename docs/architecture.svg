      <circle cx="9" cy="6.5" r="2.2" fill="#A9651F"/><circle cx="17" cy="6.5" r="2.2" fill="#CFA478"/><circle cx="25" cy="6.5" r="2.2" fill="#E3CBAE"/>
      <path d="M 0 13 L 24 13 L 24 58 L 4 58 Q 0 58 0 54 z" fill="#FAF3EB"/>
