    <rect x="968" y="104" width="206" height="220" rx="7" fill="#FBF2E9" stroke="#A9651F" stroke-width="1.3"/>
    <line x1="234" y1="196" x2="254" y2="196" stroke="#3C4A54" stroke-width="1.6" marker-end="url(#ah)"/>
    <line x1="470" y1="196" x2="490" y2="196" stroke="#3C4A54" stroke-width="1.6" marker-end="url(#ah)"/>
    <line x1="706" y1="196" x2="726" y2="196" stroke="#3C4A54" stroke-width="1.6" marker-end="url(#ah)"/>
    <line x1="942" y1="196" x2="962" y2="196" stroke="#3C4A54" stroke-width="1.6" marker-end="url(#ah)"/>
    <g transform="translate(85,118)">
      <rect x="0" y="0" width="84" height="56" rx="3" fill="#ffffff" stroke="#2C5F7C" stroke-width="1.2"/>
      <path d="M 0 14 L 84 14 M 0 28 L 84 28 M 0 42 L 84 42 M 28 14 L 28 56 M 56 14 L 56 56" stroke="#A9C1D0" stroke-width="0.9" fill="none"/>
      <path d="M 3 0 L 81 0 Q 84 0 84 3 L 84 14 L 0 14 L 0 3 Q 0 0 3 0 z" fill="#2C5F7C"/>
      <rect x="5" y="19" width="18" height="5" rx="2" fill="#7FA6BC"/><rect x="33" y="19" width="18" height="5" rx="2" fill="#C3D6E2"/><rect x="61" y="19" width="18" height="5" rx="2" fill="#7FA6BC"/>
      <rect x="5" y="33" width="18" height="5" rx="2" fill="#C3D6E2"/><rect x="33" y="33" width="18" height="5" rx="2" fill="#7FA6BC"/><rect x="61" y="33" width="18" height="5" rx="2" fill="#C3D6E2"/>
      <rect x="5" y="47" width="18" height="5" rx="2" fill="#7FA6BC"/><rect x="33" y="47" width="18" height="5" rx="2" fill="#C3D6E2"/><rect x="61" y="47" width="18" height="5" rx="2" fill="#7FA6BC"/>
    </g>
