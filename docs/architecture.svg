    <text x="732" y="96" font-size="12.5" font-weight="700">d</text>
    <text x="968" y="96" font-size="12.5" font-weight="700">e</text>
    <rect x="24" y="104" width="206" height="220" rx="7" fill="#EEF4F8" stroke="#2C5F7C" stroke-width="1.3"/>
    <rect x="260" y="104" width="206" height="220" rx="7" fill="#EBF3ED" stroke="#35715A" stroke-width="1.3"/>
    <rect x="496" y="104" width="206" height="220" rx="7" fill="#EBF3ED" stroke="#35715A" stroke-width="1.3"/>
