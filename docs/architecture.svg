      <polyline points="0,48 14,40 28,26 42,12 56,8 70,24 84,44" fill="none" stroke="#35715A" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="0" cy="48" r="2.8" fill="#ffffff" stroke="#35715A" stroke-width="1.4"/><circle cx="28" cy="26" r="2.8" fill="#ffffff" stroke="#35715A" stroke-width="1.4"/>
      <circle cx="56" cy="8" r="2.8" fill="#ffffff" stroke="#35715A" stroke-width="1.4"/><circle cx="84" cy="44" r="2.8" fill="#ffffff" stroke="#35715A" stroke-width="1.4"/>
    </g>
    <g transform="translate(599,147)">
      <ellipse cx="-30" cy="17" rx="26" ry="11" fill="#F9E6E0" stroke="#D19A88" stroke-width="1"/>
      <ellipse cx="34" cy="-19" rx="24" ry="10" fill="#F9E6E0" stroke="#D19A88" stroke-width="1"/>
